
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USS FLORIDA BLUE CPOA Store</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>
</head>
<body>
    <header>
        <h1>USS FLORIDA BLUE CPOA</h1>
        <div id="cart">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>
    <main>
        <div class="product" data-name="Chiefs Coin" data-price="20">
            <img src="images/chiefs-coin.jpg" alt="Chiefs Coin">
            <h2>Chiefs Coin</h2>
            <p>$20.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product" data-name="Chiefs Shirt" data-price="25">
            <img src="images/chiefs-shirt.jpg" alt="Chiefs Shirt">
            <h2>Chiefs Shirt (Coyote Brown)</h2>
            <p>$25.00</p>
            <button>Add to Cart</button>
        </div>
        <div class="product" data-name="Chiefs Buckle" data-price="30">
            <img src="images/chiefs-buckle.jpg" alt="Chiefs Buckle">
            <h2>Chiefs Buckle</h2>
            <p>$30.00</p>
            <button>Add to Cart</button>
        </div>
    </main>
    <footer>
        <button onclick="checkout()">Checkout</button>
    </footer>
</body>
</html>
